model: "whisper_large"
autocast_dtype: bfloat16
max_seq_len: 448
# Per-rank BF16 payload budgets preserve 64 full-length requests with the
# retained reference's head-sharded paged storage at TP2, including sink blocks.
# The independent admission cap queues further requests before cache pressure.
max_concurrent_requests: 64
resources:
  kv_cache:
    max_bytes: 2694840320
    cpu_offload_bytes: 42949672960
    prefix_cache: true
  cross_kv_cache:
    max_bytes: 8063549440
    cpu_offload_bytes: 42949672960
    prefix_cache: true
node_groups:
  - node_names: [audio_encoder]
    ranks: [0]
  - node_names: [decoder]
    ranks: [0, 1]
    tp_size: 2
