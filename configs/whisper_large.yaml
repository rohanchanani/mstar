model: "whisper_large"
autocast_dtype: bfloat16
max_seq_len: 448
# Per-rank BF16 payload budgets preserve 64 full-length requests with the
# retained reference's paged storage, including each cache's sink block.
# The independent admission cap queues further requests before cache pressure.
max_concurrent_requests: 64
resources:
  kv_cache:
    max_bytes: 5389680640
    cpu_offload_bytes: 2684354560
    prefix_cache: true
  cross_kv_cache:
    max_bytes: 16127098880
    cpu_offload_bytes: 2684354560
    prefix_cache: true
node_groups:
  - node_names: [audio_encoder, decoder]
    ranks: [0]
