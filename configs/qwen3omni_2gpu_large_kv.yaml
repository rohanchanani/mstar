model: "qwen3_omni"
max_seq_len: 32768
# Byte budgets preserve the original 128-token page capacity at BF16 for the
# published 30B checkpoint and this deployment's TP head partition.
resources:
  thinker_kv:
    max_bytes: 25769803776
    prefix_cache: true
  talker_kv:
    max_bytes: 5368709120
    prefix_cache: true
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
