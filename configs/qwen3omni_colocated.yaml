model: "qwen3_omni"
max_seq_len: 32768
# Byte budgets preserve the original 128-token page capacity at BF16 for the
# published 30B checkpoint and this deployment's TP head partition.
resources:
  thinker_kv:
    max_bytes: 3221225472
    prefix_cache: true
  talker_kv:
    max_bytes: 671088640
    prefix_cache: true
node_groups:
  - node_names: [audio_encoder, vision_encoder, Code2Wav]
    ranks: [0]

  - node_names: [Thinker, Talker]
    ranks: [0]
